<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Varun Ramakrishnan</title>
    <link rel="shortcut icon" type="image/x-icon" href="favicon.ico" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;500;600&family=IBM+Plex+Mono:wght@400;600&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <canvas id="planet-canvas" aria-label="Particle sphere"></canvas>

    <section id="warp-intro" class="warp-intro" aria-live="polite">
      <p class="warp-question">Enter Warp Speed?</p>
      <button id="warp-start" class="warp-btn" type="button">Yes</button>
    </section>

    <aside id="particle-popup" class="popup is-hidden" aria-live="polite">
      <div class="popup-inner">
        <p class="popup-tag" id="popup-tag">HOME</p>
        <h2 id="popup-title">Welcome</h2>
        <p id="popup-copy">This is my personal website. It runs a three-body simulation.</p>
      </div>
    </aside>

    <script
      src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"
      onerror="this.onerror=null;this.src='https://unpkg.com/three@0.160.0/build/three.min.js';"
    ></script>
    <script src="./script.js"></script>
  </body>
</html>
